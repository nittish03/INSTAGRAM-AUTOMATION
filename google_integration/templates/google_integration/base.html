{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}LeadPilot · Google{% endblock %}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    (() => {
      const saved = localStorage.getItem("leadpilot_google_theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    :root { color-scheme: light; }
    [data-theme="light"] { color-scheme: light; }
    [data-theme="dark"] { color-scheme: dark; }

    [data-theme="dark"] body { background: #020617 !important; color: #e2e8f0 !important; }
    [data-theme="dark"] header { background: #0f172a !important; border-color: #1e293b !important; }

    [data-theme="dark"] .bg-white { background-color: #0f172a !important; }
    [data-theme="dark"] .bg-slate-50 { background-color: #111827 !important; }
    [data-theme="dark"] .bg-slate-100 { background-color: #1f2937 !important; }
    [data-theme="dark"] .bg-slate-200 { background-color: #334155 !important; }

    [data-theme="dark"] .text-slate-900 { color: #f8fafc !important; }
    [data-theme="dark"] .text-slate-800 { color: #e2e8f0 !important; }
    [data-theme="dark"] .text-slate-700 { color: #cbd5e1 !important; }
    [data-theme="dark"] .text-slate-600 { color: #94a3b8 !important; }
    [data-theme="dark"] .text-slate-500 { color: #94a3b8 !important; }
    [data-theme="dark"] .text-slate-400 { color: #64748b !important; }

    [data-theme="dark"] .border-slate-300 { border-color: #334155 !important; }
    [data-theme="dark"] .border-slate-200 { border-color: #334155 !important; }
    [data-theme="dark"] .border-slate-100 { border-color: #1f2937 !important; }
    [data-theme="dark"] .divide-slate-100 > :not([hidden]) ~ :not([hidden]) { border-color: #1f2937 !important; }

    [data-theme="dark"] input,
    [data-theme="dark"] textarea,
    [data-theme="dark"] select {
      background-color: #0b1220 !important;
      color: #e2e8f0 !important;
    }

    [data-theme="light"] input,
    [data-theme="light"] textarea,
    [data-theme="light"] select {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="{% url 'google_integration:connect' %}" class="flex items-center gap-2 font-semibold text-slate-900">
        <span class="inline-grid w-8 h-8 rounded-lg bg-purple-600 text-white place-items-center text-sm">L</span>
        LeadPilot · Google Workspace
      </a>
      <nav class="flex items-center gap-4 text-sm">
        <a href="{% url 'google_integration:sheets_list' %}" class="text-slate-600 hover:text-purple-700">Sheets</a>
        <a href="{% url 'google_integration:connect' %}" class="text-slate-600 hover:text-purple-700">Account</a>
        <a href="/admin/" class="text-slate-600 hover:text-purple-700">Admin</a>
        <button id="theme-toggle" type="button" class="text-slate-600 hover:text-purple-700">
          Toggle Theme
        </button>
      </nav>
    </div>
  </header>

  {% if messages %}
    <div class="max-w-6xl mx-auto px-6 mt-4 space-y-2">
      {% for m in messages %}
        <div class="rounded-md px-4 py-2 text-sm
          {% if m.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
          {% elif m.tags == 'warning' %}bg-amber-50 text-amber-700 border border-amber-200
          {% elif m.tags == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-200
          {% else %}bg-slate-100 text-slate-700 border border-slate-200{% endif %}">
          {{ m }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <script>
    (() => {
      const btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") || "light";
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("leadpilot_google_theme", next);
      });
    })();
  </script>
</body>
</html>
